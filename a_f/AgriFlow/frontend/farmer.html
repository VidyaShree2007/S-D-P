<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farmer Hub - AgriFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="farmer">
  <header class="navbar" id="navbar"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>👨‍🌾 Farmer Hub</h1>
        <p class="subtitle">Add your crops and manage the orders you receive.</p>
      </div>

      <div class="card">
        <h2>➕ Add a New Crop</h2>
        <form id="cropForm">
          <div class="form-grid">
            <div>
              <label for="cropName">Crop Name</label>
              <input type="text" id="cropName" placeholder="e.g. Tomato" required />
            </div>
            <div>
              <label for="farmerName">Farmer / Farm Name</label>
              <input type="text" id="farmerName" placeholder="e.g. Ramesh" required />
            </div>
            <div>
              <label for="cropQuantity">Quantity (kg)</label>
              <input type="number" id="cropQuantity" min="1" step="1" placeholder="e.g. 100" required />
            </div>
            <div>
              <label for="cropPrice">Price per kg (₹)</label>
              <input type="number" id="cropPrice" min="0.01" step="0.01" placeholder="e.g. 25" required />
            </div>
          </div>
          <button type="submit" class="btn" style="margin-top:18px">Add Crop</button>
          <div id="cropMessage" class="message"></div>
        </form>
      </div>

      <div class="card">
        <h2>📦 My Crops</h2>
        <div id="farmerCrops" class="table-wrap"><p class="empty">Loading...</p></div>
      </div>

      <div class="card">
        <h2>🧾 Orders Received</h2>
        <div id="ordersList" class="table-wrap"><p class="empty">Loading...</p></div>
      </div>
    </div>
  </main>

  <!-- Edit crop popup -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2 id="editTitle">Edit crop</h2>
      <form id="editForm">
        <input type="hidden" id="editCropId" />

        <label for="editPrice">Price per kg (₹)</label>
        <input type="number" id="editPrice" min="0.01" step="0.01" required />

        <label for="editQuantity">Stock (kg)</label>
        <input type="number" id="editQuantity" min="0" step="1" required />
        <p id="editQtyHelp" class="subtitle" style="display:none;font-size:0.85rem;margin-top:6px">
          Vendor stock increases when you buy wholesale from farmers.
        </p>

        <div class="modal-actions">
          <button type="submit" class="btn">Save</button>
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        </div>
        <div id="editMessage" class="message"></div>
      </form>
    </div>
  </div>

  <footer>AgriFlow © 2026 • Fresh from the farm 🌱</footer>
  <script src="script.js"></script>
</body>
</html>
