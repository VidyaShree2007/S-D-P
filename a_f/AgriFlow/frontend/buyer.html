<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace - AgriFlow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="buyer">
  <header class="navbar" id="navbar"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>🛒 Marketplace</h1>
        <p class="subtitle">Fresh crops from farmers and vendors. Sold-out crops are hidden automatically.</p>
      </div>

      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="🔍 Search crops (e.g. tomato)..." />
        <select id="sellerFilter">
          <option value="">All sellers</option>
          <option value="farmer">👨‍🌾 Farmers only</option>
          <option value="vendor">🏪 Vendors only</option>
        </select>
      </div>

      <div id="cropGrid" class="crop-grid"><p class="empty">Loading...</p></div>

      <div class="card" id="myOrdersCard" style="display:none">
        <h2>🧾 My Orders</h2>
        <div id="myOrders" class="table-wrap"><p class="empty">Loading...</p></div>
      </div>
    </div>
  </main>

  <!-- Buy popup -->
  <div id="buyModal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Buy crop</h2>
      <p id="modalInfo" class="subtitle"></p>

      <form id="orderForm">
        <input type="hidden" id="orderCropId" />

        <label for="orderQuantity">Quantity (kg)</label>
        <input type="number" id="orderQuantity" min="1" step="1" placeholder="How many kg?" required />

        <div id="orderTotal" class="total-preview">Total: ₹0.00</div>

        <div class="modal-actions">
          <button type="submit" class="btn">Place Order</button>
          <button type="button" class="btn btn-secondary" onclick="closeBuyModal()">Cancel</button>
        </div>
        <div id="orderMessage" class="message"></div>
      </form>
    </div>
  </div>

  <footer>AgriFlow © 2026 • Fresh from the farm 🌱</footer>
  <script src="script.js"></script>
</body>
</html>
